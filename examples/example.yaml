source:
  host: source.example.com
  port: 443
  database: example1
  ssl: yes  # use HTTPS
  # netrc_path: /etc/odoo/source.netrc  # Optional: path to credentials file

target:
  host: localhost
  port: 8069
  database: test
  # netrc_path: /etc/odoo/target.netrc  # Optional: path to credentials file

manual_mapping:
  res.company:
    {2: 1}

options:
  prefix: '__export_sfit__'  # Use a custom prefix for xmlids
  dry_run: False  # Run, but dont write to target database
  debug: True     # Show debug messages
  auto_xmlid_lookup: True  # Reuse records that share xmlids on the target
  # netrc_path: /etc/odoo/odoosync.netrc  # Optional: shared credentials file
  # sync_dependencies: true  # Optional: create related records outside the domain selection

models:

# Partner records: sync only customers belonging to our company 2
- model: res.partner
  domain: [['customers', '=', True], ['company_id', '=', 2]]
  field_mapping:
    x_field: y_field  # Optional: rename source field to destination field
  excluded_fields:
  - signup_url  # exclude a field, sync all others
  context: {'active_test': False}  # Sync inactive partners too

# Partner categories: sync only if a partner depends on it
- model: res.partner.category
  no_domain: True

# Reverse partner sync: sync only state_id
- model: res.partner
  included_fields:
  - state_id 
  reverse: True 

