source:
  host: source.example.com
  port: 443
  database: example1
  ssl: yes  # enable HTTPS
  # netrc_path: /etc/odoo/source.netrc  # Optional: credentials path per endpoint

target:
  host: localhost
  port: 8069
  database: test
  # netrc_path: /etc/odoo/target.netrc  # Optional: credentials path per endpoint

record_id_mappings:
  forward:
    res.company:
      2: 1  # use dest company 1 for source company 2
    res.users:
      7: 3  # pin a specific user mapping for forward sync
  reverse:
    res.partner:
      99: 10  # when reverse syncing, reuse source id 99 for dest id 10
  xmlid_overrides:
    uom.uom:
      product.product_uom_unit: uom.product_uom_unit  # translate source xmlid to new module prefix

options:
  prefix: '__export_sfit__'  # Use a custom prefix for xmlids
  dry_run: False  # Run, but dont write to target database
  debug: True     # Show debug messages
  auto_xmlid_lookup: True  # Reuse records that share xmlids on the target
  log_level: INFO  # Optional: override the logging threshold (DEBUG, INFO, WARNING, ERROR)
  mute_log_levels:
    - INFO  # Optional: drop selected severities from the output (progress stays visible)
  # rpc_retry_attempts: 5  # Optional: number of attempts for transient HTTP errors (default 3)
  # rpc_retry_delay: 2.0   # Optional: seconds to wait before the first retry (default 2.0)
  # rpc_retry_backoff: 1.5 # Optional: multiplier applied to delay after each retry (default 1.5)
  # netrc_path: /etc/odoo/odoosync.netrc  # Optional: shared credentials file
  # sync_dependencies: true  # Optional: load related records referenced by relational fields
  # batch_size: 500  # Optional: override default 1000 chunking
  # create_batch_size: 200  # Optional: cap record creation payloads (default min(batch_size, 200))
  # translation_batch_size: 750  # Optional: limit ir.model.data lookups per request (default 1000)

models:

- model: res.partner
  batch_size: 250  # Optional: override per-model chunk size (falls back to options.batch_size/default)
  # create_batch_size: 100  # Optional: override record creation chunk size for this model
  domain: [['customer_rank', '>', 0], ['company_id', '=', 2]]
  field_mappings:
    x_field: y_field        # rename custom field when the destination uses y_field
    email_formatted: email  # flatten formatted email into the standard email field
  value_mappings:
    lang:
      en_US: es_ES
      nl_NL: es_ES
      __default__: es_ES     # default when value missing
    customer_rank:
      0: 0
      1: 10
      2: 20                  # scale customer rank on write
  forced_values:
    country_id: 21           # lock every record to destination country id 21
    category_id:
      - [6, 0, [10, 12]]     # assign specific categories without syncing them
  excluded_fields:
  - signup_url               # skip marketing signup URL
  context: {'active_test': False}
  retry_on_create:
    fields:
      - vat
      - x_legacy_flag
    max_subset: 2

- model: product.template
  domain: [['sale_ok', '=', True]]
  included_fields:
  - list_price
  - standard_price
  - tax_ids
  field_mappings:
    x_barcode: barcode
    type: is_storable
  value_mappings:
    sale_ok: True
    type:
      product: True
      service: False
      __default__: False
    intrasat_id:
      lookup:
        source_model: report.intrastat.code
        source_field: code
        dest_model: hs.code
        dest_field: code
        # domain: [['company_id', '=', 2]]  # Optional: extra filters for the destination search
  excluded_fields:
  - message_ids

- model: res.partner.category
  no_domain: True  # pull every category referenced by dependencies

- model: res.partner
  reverse: True
  included_fields:
  - state_id
  - email
  value_mappings:
    state_id:
      type: many2one
      map:
        NY: 'US-33'
  context: {'active_test': False}

- model: mrp.bom.line
  domain: [['bom_id.product_tmpl_id', '!=', False]]
  field_mappings:
    product_id:
      indirect_via: product_tmpl_id
      target_model: product.template
      target_field: product_variant_id.product_tmpl_id.product_variant_id  # traverse relations via dotted path

